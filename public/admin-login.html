<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailConnect Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <section class="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/90 p-6 shadow-2xl sm:p-8">
        <div class="mb-8">
          <p class="text-xs font-semibold uppercase tracking-[0.3em] text-sky-300">RailConnect</p>
          <h1 class="mt-3 text-3xl font-bold text-white">Admin Login</h1>
          <p class="mt-2 text-sm leading-6 text-slate-400">Restricted access for railway operations administrators.</p>
        </div>

        <form id="admin-login-form" class="space-y-4">
          <div>
            <label for="admin-username" class="mb-2 block text-sm font-medium text-slate-200">Admin username</label>
            <input id="admin-username" name="username" type="text" autocomplete="username" placeholder="Enter admin username" class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-white placeholder:text-slate-500 focus:border-sky-500 focus:outline-none" required />
          </div>
          <div>
            <label for="admin-password" class="mb-2 block text-sm font-medium text-slate-200">Password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Enter admin password" class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-white placeholder:text-slate-500 focus:border-sky-500 focus:outline-none" required />
          </div>
          <p id="admin-login-error" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 px-3 py-3 text-sm text-rose-200"></p>
          <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 px-4 py-3 font-semibold text-white shadow-lg shadow-sky-500/20 transition hover:from-sky-400 hover:to-blue-500">Open admin panel</button>
        </form>

        <a href="/" class="mt-6 block text-center text-sm font-medium text-slate-400 transition hover:text-white">Back to main portal</a>
      </section>
    </main>

    <script>
      const currentUser = JSON.parse(localStorage.getItem('railway-user') || 'null');
      if (currentUser?.role === 'admin') {
        window.location.replace('/admin/dashboard');
      }

      document.getElementById('admin-login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const error = document.getElementById('admin-login-error');
        const formData = new FormData(form);
        error.classList.add('hidden');

        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: formData.get('username'),
            password: formData.get('password'),
          }),
        });

        const result = await response.json().catch(() => ({ message: 'Unable to sign in.' }));
        if (!response.ok) {
          error.textContent = result.message || 'Admin access denied.';
          error.classList.remove('hidden');
          return;
        }

        localStorage.setItem('railway-user', JSON.stringify(result.user));
        window.location.replace('/admin/dashboard');
      });
    </script>
  </body>
</html>
